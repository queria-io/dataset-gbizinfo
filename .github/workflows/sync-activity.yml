name: Sync (activity)

# 活動データ (補助金・調達・財務・職場、計約220MB) を日次で取得して再ビルドする。
# gBizINFO のファイルは日次更新されるため鮮度を上げる目的。基本情報 (1.7GB) は
# 据え置き、月次の Sync (full) で更新する。

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 06:00 JST
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@dc0e5caa95da02a5303726dca8df5dec26c94322
    with:
      mode: activity
    secrets:
      GBIZINFO_API_TOKEN: ${{ secrets.GBIZINFO_API_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
