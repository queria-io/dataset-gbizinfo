name: Sync

# 月次の full ビルド (基本情報・特許を含む全種別)。mode は渡さず、main.py の既定の full。
# 日次の活動データ更新は sync-activity.yml が担う。

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  schedule:
    - cron: "0 20 1 * *" # 毎月1日 05:00 JST
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@dc0e5caa95da02a5303726dca8df5dec26c94322
    with:
      dataset_name: gbizinfo
    secrets:
      GBIZINFO_API_TOKEN: ${{ secrets.GBIZINFO_API_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
