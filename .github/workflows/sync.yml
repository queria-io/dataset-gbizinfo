name: Sync

# 月次の full ビルド (基本情報を含む全 5 種別)。GBIZINFO_SYNC_MODE は未設定で
# main.py の既定 full。日次の活動データ更新は sync-activity.yml が担う。
#
# gBizINFO のアクセストークンはこのリポジトリ専用の Repository secret
# GBIZINFO_API_TOKEN を使う。共有ワークフロー (dataset-shared) には渡さず、
# ここで自己完結してビルドする。それ以外の認証情報は org の secrets/variables。

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  schedule:
    - cron: "0 20 1 * *" # 毎月1日 05:00 JST
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Checkpoint も同じカタログに push する。並行して走ると、後から push した側が
    # 先の push の最中にカタログを変えてしまい、先の側が "The dataset changed while
    # this push was running" で落ちる。Checkpoint は dataset-shared の reusable を
    # 経由し、そちらの job が同じ group に入っているので、ここでも同じ group を書く。
    # 上の workflow レベルの concurrency は Sync 同士しか直列化しない。
    #
    # 走っている側は止めない。push の途中で切ると、公開されたカタログと
    # データファイルの対応が途中の状態で残る
    concurrency:
      group: queria-catalog-write
      cancel-in-progress: false
      # 既定の queue: single は pending を 1 つしか持てず、後から来た run が
      # 待っている run を蹴る。月 1 回の Checkpoint が日次の列に埋もれないよう、
      # 待てる数を増やす
      queue: max
    env:
      PYTHONUNBUFFERED: "1"
      # queria は誰のデータセットに書くのかをトークンから決める。R2 の鍵は渡さない
      QUERIA_TOKEN: ${{ secrets.QUERIA_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      GBIZINFO_API_TOKEN: ${{ secrets.GBIZINFO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13

      # queria はベータ開発中のため、常に最新版を使用する
      - run: uv lock --upgrade-package queria && uv sync

      - name: Build and push
        run: scripts/build.sh

  notify-failure:
    runs-on: ubuntu-latest
    needs: sync
    if: failure()
    steps:
      - name: Notify Discord on failure
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\": [{\"title\": \"Sync Failed\", \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"color\": 15158332, \"fields\": [{\"name\": \"Repository\", \"value\": \"${{ github.repository }}\"}, {\"name\": \"Branch\", \"value\": \"${{ github.ref_name }}\"}, {\"name\": \"Commit\", \"value\": \"${{ github.sha }}\"}]}]}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
