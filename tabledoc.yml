title: gBizINFO 法人活動情報
description: |-
  経済産業省 gBizINFO の法人活動情報です。法人番号ごとの基本情報（資本金・従業員数・設立年・業種）と、補助金・調達・財務・職場情報・表彰・届出と認定・特許の実績を収録しています。

  出典：gBizINFO（経済産業省）。gBizINFO 利用規約に基づき出典を明記して再配布しています。最新性・正確性・完全性等が保証されたものではありません。
