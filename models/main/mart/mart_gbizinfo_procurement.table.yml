schema: main
name: mart_gbizinfo_procurement
title: 調達(受注)実績
description: |-
  gBizINFO の国の調達（受注）の実績です。1 行が 1 件の受注です。

  - 法人番号（corporate_number）で houjin_bangou と結合できます
sources:
  - path: https://info.gbiz.go.jp/
fields:
  - name: corporate_number
    title: 法人番号
    description: 13桁。国税庁法人番号(houjin_bangou)と結合できる
    annotations: { queria: { semantic: { role: entity, name: corporate_number } } }
  - name: name
    title: 商号または名称
  - name: title
    title: 件名
  - name: award_price
    title: 落札価格
    description: 円
  - name: org_name
    title: 発注組織名
  - name: note
    title: 備考
  - name: order_date
    title: 受注日
