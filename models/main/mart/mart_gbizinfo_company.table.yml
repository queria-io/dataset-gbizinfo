schema: main
name: mart_gbizinfo_company
title: 法人活動サマリ
description: |-
  gBizINFO の法人活動情報を 1 法人 1 行にまとめたものです。資本金・従業員数・設立年・業種に、補助金と調達の集計、最新の財務、職場の指標を加えています。

  - 法人番号（corporate_number）で houjin_bangou と結合できます。所在地は houjin_bangou にあります
published: true
sources:
  - path: https://info.gbiz.go.jp/
fields:
  - name: corporate_number
    title: 法人番号
    description: 13桁。国税庁法人番号(houjin_bangou)と結合できる
    semantic: { role: entity, name: corporate_number }
  - name: name
    title: 商号または名称
  - name: capital_stock
    title: 資本金
    description: 円
  - name: employee_number
    title: 従業員数
  - name: date_of_establishment
    title: 設立年月日
  - name: founding_year
    title: 創業年
  - name: business_summary
    title: 事業概要
  - name: business_items
    title: 事業種目
  - name: representative_name
    title: 代表者名称
  - name: company_url
    title: WebサイトURL
  - name: subsidy_count
    title: 補助金交付件数
  - name: subsidy_total_amount
    title: 補助金交付総額
    description: 円
  - name: procurement_count
    title: 調達(受注)件数
  - name: procurement_total_award
    title: 調達(受注)落札総額
    description: 円
  - name: latest_fiscal_year
    title: 最新事業年度
  - name: latest_net_sales
    title: 売上高(最新)
    description: 円
  - name: latest_ordinary_income
    title: 経常利益(最新)
    description: 円
  - name: latest_net_income
    title: 当期純利益(最新)
    description: 円
  - name: latest_total_assets
    title: 総資産額(最新)
    description: 円
  - name: latest_net_assets
    title: 純資産額(最新)
    description: 円
  - name: avg_age
    title: 従業員の平均年齢
  - name: avg_monthly_overtime
    title: 月平均所定外労働時間
  - name: female_ratio
    title: 女性労働者の割合
    description: ％
