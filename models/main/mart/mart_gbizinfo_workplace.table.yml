schema: main
name: mart_gbizinfo_workplace
title: 職場情報
description: |-
  gBizINFO の職場情報です。1 行が 1 法人で、女性活躍推進法・次世代育成支援対策推進法に基づいて法人が公表した平均年齢・平均継続勤務年数・所定外労働時間・女性労働者比率・女性管理職比率・育児休業取得者数を持ちます。

  - 値を 1 つ以上報告している法人だけです
  - 項目ごとに報告している法人の数が大きく違います。割合を出すときは、その項目を報告した法人を母数にしてください
keywords:
  - 職場環境
  - 女性活躍
  - 育児休業
  - 残業時間
  - 平均年齢
  - 法人
sources:
  - path: https://info.gbiz.go.jp/
fields:
  - name: corporate_number
    title: 法人番号
    description: 13桁。国税庁法人番号(houjin_bangou)と結合できる
    annotations: { queria: { semantic: { role: entity, name: corporate_number } } }
  - name: name
    title: 商号または名称
  - name: avg_age
    title: 従業員の平均年齢
    description: 歳。報告した法人は 2,715 法人(2026-08 時点)
  - name: avg_monthly_overtime
    title: 月平均所定外労働時間
    description: 時間。報告した法人は 2,700 法人(2026-08 時点)
  - name: avg_service_years_scope
    title: 平均継続勤務年数の対象区分
    description: 継続勤務年数の対象の労働者区分（正社員・その他など）。法人間で比べるときはこの列で統一
  - name: avg_service_years_male
    title: 平均継続勤務年数（男性）
    description: 年
  - name: avg_service_years_female
    title: 平均継続勤務年数（女性）
    description: 年
  - name: avg_service_years_regular
    title: 正社員の平均継続勤務年数
    description: 年。男女別の欄とは別に報告する項目で、報告した法人は 2,694 法人(2026-08 時点)
  - name: female_ratio_scope
    title: 女性労働者比率の対象区分
    description: 女性労働者の割合の対象の労働者区分（正社員・その他・基幹的な職種）
  - name: female_ratio
    title: 労働者に占める女性労働者の割合
    description: ％
  - name: female_managers
    title: 女性管理職人数
  - name: total_managers
    title: 管理職全体人数（男女計）
  - name: female_manager_ratio
    title: 女性管理職比率
    description: 女性管理職比率（%）。管理職が 0 人の法人は空
  - name: female_officers
    title: 女性役員人数
  - name: total_officers
    title: 役員全体人数（男女計）
  - name: female_officer_ratio
    title: 女性役員比率
    description: 女性役員比率（%）。役員が 0 人の法人は空
  - name: childcare_leave_eligible_male
    title: 育児休業対象者数（男性）
  - name: childcare_leave_taken_male
    title: 育児休業取得者数（男性）
  - name: childcare_leave_ratio_male
    title: 育児休業取得率（男性）
    description: 男性の育児休業取得率（%）。100% を超える行がある
  - name: childcare_leave_eligible_female
    title: 育児休業対象者数（女性）
  - name: childcare_leave_taken_female
    title: 育児休業取得者数（女性）
  - name: childcare_leave_ratio_female
    title: 育児休業取得率（女性）
    description: 女性の育児休業取得率（%）。100% を超える行がある
